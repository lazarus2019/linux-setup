# Setup XDG for screen sharing and start waypaper and waybar
exec-once = ~/.config/hypr/scripts/xdg.sh

# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Load Wallpaper
exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh

# Load Notification Daemon
exec-once = swaync

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Using hypridle to start hyprlock
exec-once = hypridle

# Load cliphist history
exec-once = wl-paste --watch cliphist store

# Autostart ML4W App
exec-once = ~/.config/ml4w/scripts/ml4w-autostart.sh

# Start autostart cleanup
exec-once = ~/.config/hypr/scripts/cleanup.sh

# Load configuration from ML4W Hyprland Settings App
exec = ~/.config/com.ml4w.hyprlandsettings/hyprctl.sh

# Dock
exec-once = ~/.config/nwg-dock-hyprland/launch.sh

# Custom apps
# Workspace 1
exec-once = ~/.config/hypr/scripts/startup-app.sh 1 google-chrome-stable "--enable-features=UseOzonePlatform --ozone-platform=wayland --enable-wayland-ime"
# Workspace 2
exec-once = ~/.config/hypr/scripts/startup-app.sh 2 code "--enable-features=UseOzonePlatform --ozone-platform=wayland --enable-wayland-ime"
# Workspace 3
# Workspace 4
exec-once = ~/.config/hypr/scripts/startup-app.sh 5 discord "--enable-features=UseOzonePlatform --ozone-platform=wayland --enable-wayland-ime"
# Workspace 5
exec-once = ~/.config/hypr/scripts/startup-app.sh 5 wezterm
# Workspace 6
# Workspace 7
# Workspace 8
# Workspace 9