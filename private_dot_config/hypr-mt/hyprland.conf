exec-once=hyprctl plugin load /nix/store/fggycvz562dzh5naysr4xj9viqlkjwm2-hy3-hl0.50.0/lib/libhy3.so
$alt=ALT
$mod=SUPER
animations {
  bezier=wind, 0.05, 0.9, 0.1, 1.05
  bezier=winIn, 0.1, 1.1, 0.1, 1.1
  bezier=winOut, 0.3, -0.3, 0, 1
  bezier=liner, 1, 1, 1, 1
  animation=windows, 1, 6, wind, slide
  animation=windowsIn, 1, 6, winIn, slide
  animation=windowsOut, 1, 5, winOut, slide
  animation=windowsMove, 1, 5, wind, slide
  animation=border, 1, 1, liner
  animation=borderangle, 1, 30, liner, once
  animation=fade, 1, 10, default
  animation=workspaces, 1, 5, wind
  enabled=true
}

binds {
  allow_pin_fullscreen=true
  allow_workspace_cycles=false
  pass_mouse_when_bound=false
  workspace_back_and_forth=false
}

cursor {
  hide_on_key_press=true
}

decoration {
  blur {
    enabled=true
    ignore_opacity=true
    new_optimizations=on
    passes=3
    size=6
    vibrancy=0.169600
    xray=true
  }

  shadow {
    color=rgba(27282299)
    enabled=true
    range=4
    render_power=30
  }
  active_opacity=1.000000
  fullscreen_opacity=1.000000
  inactive_opacity=0.800000
  rounding=10
  rounding_power=2
}

dwindle {
  preserve_split=true
  pseudotile=true
}

general {
  border_size=3
  col.active_border=rgb(66d9ef)
  col.inactive_border=rgb(75715e)
  gaps_in=5
  gaps_out=20, 5, 5, 5
  layout=hy3
  resize_on_border=true
}

gestures {
  workspace_swipe=true
}

group {
  groupbar {
    col.active=rgb(66d9ef)
    col.inactive=rgb(75715e)
    text_color=rgb(f8f8f2)
  }
  col.border_active=rgb(66d9ef)
  col.border_inactive=rgb(75715e)
  col.border_locked_active=rgb(a1efe4)
}

input {
  touchpad {
    clickfinger_behavior=false
    middle_button_emulation=true
    natural_scroll=yes
    scroll_factor=1.000000
  }
  follow_mouse=1
  kb_layout=us
  kb_model=
  kb_options=ctrl:nocaps
  kb_variant=,qwerty
  mouse_refocus=false
  numlock_by_default=true
  sensitivity=0
}

misc {
  background_color=rgb(272822)
  disable_hyprland_logo=true
  disable_splash_rendering=true
  initial_workspace_tracking=1
  key_press_enables_dpms=true
  mouse_move_enables_dpms=true
}

plugin {
  hy3 {
    autotile {
      enable=true
      trigger_height=500
      trigger_width=800
    }

    tabs {
      border_width=1
    }
  }
}
bind=$mod, RETURN, exec, kitty
bind=$mod, O, exec, focus-or-open firefox class:firefox
bind=$mod, Q, killactive
bind=$mod, F, fullscreen, 0
bind=$mod, M, fullscreen, 1
bind=$mod SHIFT, F, togglefloating
bind=$mod, D, hy3:makegroup, h
bind=$mod, S, hy3:makegroup, v
bind=$mod, T, hy3:makegroup, tab, toggle
bind=$mod, H, hy3:movefocus, l, visible, nowarp
bind=$mod, L, hy3:movefocus, r, visible, nowarp
bind=$mod, K, hy3:movefocus, u, visible, nowarp
bind=$mod, J, hy3:movefocus, d, visible, nowarp
bind=$mod SHIFT, H, hy3:movewindow, l
bind=$mod SHIFT, L, hy3:movewindow, r
bind=$mod SHIFT, K, hy3:movewindow, u
bind=$mod SHIFT, J, hy3:movewindow, d
bind=$alt, H, hy3:focustab, l
bind=$alt, L, hy3:focustab, r
bind=$mod CTRL, R, exec, hyprctl reload
bind=$mod, U, workspace, m+1
bind=$mod SHIFT, U, movetoworkspacesilent, m+1
bind=$mod, I, workspace, m-1
bind=$mod SHIFT, I, movetoworkspacesilent, m-1
bind=$mod SHIFT, S, exec, flameshot gui
bind=$mod CTRL, Q, exec, pkill rofi || rofi -show rofi-power-menu
bind=$mod, SPACE, exec, pkill rofi || rofi -show drun -replace -i
bind=$mod $alt, Q, exec, hyprlock
bind=$mod, B, exec, pkill rofi || bzmenu -l rofi
bind=$mod, C, exec, pkill rofi || rofi -show calc
bind=$mod, N, exec, pkill rofi || networkmanager_dmenu
bind=$mod, P, exec, pkill rofi || rofi-pass
bind=, XF86MonBrightnessUp, exec, brightnessctl -q s +10%
bind=, XF86MonBrightnessDown, exec, brightnessctl -q s 10%-
bind=, XF86AudioRaiseVolume, exec, pamixer -i 10
bind=, XF86AudioLowerVolume, exec, pamixer -d 10
bind=, XF86AudioMute, exec, pamixer -t
